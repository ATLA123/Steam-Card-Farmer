name: Steam Card Farmer
on:
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - name: Download ArchiSteamFarm
        run: |
          mkdir asf && cd asf
          wget https://github.com
          unzip ASF-linux-x64.zip
          chmod +x ArchiSteamFarm

      - name: Create Bot Config
        run: |
          mkdir -p asf/config
          cat <<EOF > asf/config/bot1.json
          {
            "Name": "bot1",
            "SteamLogin": "${{ secrets.STEAM_USERNAME }}",
            "SteamPassword": "${{ secrets.STEAM_PASSWORD }}",
            "Enabled": true,
            "SteamParentalCode": "0",
            "AutoSteamSaleEvent": false
          }
          EOF

      - name: Run ArchiSteamFarm
        run: |
          cd asf
          # Truyền trực tiếp mã Guard của bạn vào lệnh chạy dưới đây
          ./ArchiSteamFarm --headless --auth-code="QKMX9"
