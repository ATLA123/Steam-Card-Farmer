name: Steam Card Farmer
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - name: Download ArchiSteamFarm
        run: |
          mkdir asf && cd asf
          wget https://github.com
          unzip ASF-linux-x64.zip
          chmod +x ArchiSteamFarm

      - name: Create Bot Config
        run: |
          mkdir -p asf/config
          cat <<EOF > asf/config/bot1.json
          {
            "Name": "bot1",
            "SteamLogin": "${{ secrets.STEAM_USERNAME }}",
            "SteamPassword": "${{ secrets.STEAM_PASSWORD }}",
            "Enabled": true,
            "CustomGamePlayedWhileIdling": "Counter-Strike 2"
          }
          EOF

      - name: Run ArchiSteamFarm
        run: |
          cd asf
          ./ArchiSteamFarm --headless
